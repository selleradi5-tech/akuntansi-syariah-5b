<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Open City V13 • Straight Cars</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial;touch-action:none}canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:8px;left:8px;right:150px;z-index:5;font-size:12px;text-shadow:0 2px 3px #000}.box{display:inline-block;background:#071018dd;border:1px solid #fff4;border-radius:10px;padding:6px 8px;margin:0 3px 4px 0}.wide{display:block;max-width:600px}
#map{position:fixed;right:8px;top:8px;width:135px;height:135px;border:2px solid #fff6;border-radius:12px;z-index:5}
#joy{position:fixed;left:15px;bottom:18px;width:145px;height:145px;border:2px solid #fff3;border-radius:50%;background:#fff1;z-index:10}#stick{position:absolute;left:40px;top:40px;width:62px;height:62px;border-radius:50%;background:#fff4}
#buttons{position:fixed;right:10px;bottom:15px;z-index:10;display:grid;grid-template-columns:repeat(2,76px);gap:7px}button{height:50px;border:1px solid #fff4;border-radius:13px;background:#071018e8;color:#fff;font-weight:bold;font-size:10px}.widebtn{grid-column:span 2}
#start{position:fixed;inset:0;background:#071018f2;z-index:20;display:flex;align-items:center;justify-content:center}.panel{width:min(90%,430px);padding:24px;border:1px solid #fff3;border-radius:20px;background:#101820;text-align:center}.panel h1{font-size:34px;margin:0 0 5px}.play{width:100%;height:56px;background:#29965d;font-size:17px}
#msg{position:fixed;z-index:15;top:45%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:bold;text-shadow:0 3px 8px #000;opacity:0;pointer-events:none;text-align:center}
</style></head><body>
<canvas id="game"></canvas><canvas id="map"></canvas>
<div id="hud"><div class="box"><b>OPEN CITY V13</b> 💵 $<b id="money">1000</b> ❤️ <span id="hp">100</span>%</div><div class="box">⚡ <span id="stam">100</span>% 🚨 <span id="wanted">☆☆☆☆☆</span> ⛽ <span id="fuel">100</span>% 🚀 <span id="nitro">100</span>% 🧭 <span id="speed">0</span></div><div id="mission" class="box wide">Misi 1</div></div>
<div id="msg"></div><div id="joy"><div id="stick"></div></div>
<div id="buttons"><button id="car">🚗 MOBIL</button><button id="run">🏃 LARI</button><button id="act">🎯 AKSI</button><button id="horn">📣 KLAKSON</button><button id="job">💼 JOB</button><button id="save">💾 SIMPAN</button><button id="load">📂 LOAD</button><button id="pause" class="widebtn">⏸️ PAUSE</button></div>
<div id="start"><div class="panel"><h1>🌆 OPEN CITY</h1><b>V13 • STRAIGHT CAR UPDATE</b><p>V13: dunia lebih hidup dengan siklus siang-malam, hujan, lampu kendaraan, dan efek lingkungan.</p><button class="play" id="play">▶ MULAI GAME</button></div></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),m=document.getElementById('map'),mm=m.getContext('2d');let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();
const WORLD=1800,GRID=300,ROAD=76;let seed=7;function rnd(a,b){seed=(seed*9301+49297)%233280;return a+(seed/233280)*(b-a)}
const roads=[];for(let q=-WORLD;q<=WORLD;q+=GRID){roads.push({x:q-ROAD/2,y:-WORLD,w:ROAD,h:WORLD*2});roads.push({x:-WORLD,y:q-ROAD/2,w:WORLD*2,h:ROAD})}
const buildings=[],trees=[];for(let x=-WORLD+80;x<WORLD;x+=GRID)for(let y=-WORLD+80;y<WORLD;y+=GRID){for(let i=0;i<3;i++)buildings.push({x:x+rnd(0,190),y:y+rnd(0,190),w:rnd(45,105),h:rnd(45,105),col:['#5d686f','#75665a','#50665a','#665d70'][i%4]});for(let i=0;i<3;i++)trees.push({x:x+rnd(0,230),y:y+rnd(0,230)})}
const p={x:0,y:0,hp:100,st:100,a:0},car={x:70,y:0,a:0,s:0,fuel:100,damage:0,nitro:100};let weather='clear',rain=0;let inCar=false,started=false,paused=false,clock=0,money=1000,wanted=0,mission=0,xp=0,level=1,job=null,jobTime=0;const lights=[];for(let q=-WORLD;q<=WORLD;q+=GRID)for(let z=-WORLD;z<=WORLD;z+=GRID)lights.push({x:q,y:z,phase:rnd(0,10)});
const missions=[{x:600,y:600,t:'Temui kurir di timur'},{x:-600,y:300,t:'Antarkan paket ke gudang'},{x:-600,y:-600,t:'Cari kendaraan target'},{x:600,y:-600,t:'Kabur ke markas'},{x:0,y:900,t:'Bantu bengkel'},{x:900,y:0,t:'Temui klien'},{x:-900,y:0,t:'Temui kontak malam'},{x:0,y:-900,t:'Kembali ke rumah'}];
const places=[{x:300,y:0,t:'shop',col:'#e9a72e'},{x:-300,y:0,t:'garage',col:'#48a7e8'},{x:0,y:450,t:'safe',col:'#58c978'}];
const cars=[];for(let i=0;i<32;i++){const vertical=i%2===0,q=Math.round(rnd(-6,6))*GRID,lane=i%4<2?-18:18;cars.push({x:vertical?q+lane:rnd(-WORLD,WORLD),y:vertical?rnd(-WORLD,WORLD):q+lane,a:vertical?(i%4<2?Math.PI/2:-Math.PI/2):(i%4<2?0:Math.PI),s:rnd(35,70),col:['#d94343','#e2b73d','#3e8fd0','#df6b2c','#b95bd0'][i%5],vertical})}
const npcs=[];for(let i=0;i<45;i++)npcs.push({x:rnd(-WORLD,WORLD),y:rnd(-WORLD,WORLD),a:rnd(0,6.28),s:rnd(10,28),t:rnd(1,4)});let police=[];
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let jx=0,jy=0,jid=null;
function joyMove(e){const r=joy.getBoundingClientRect(),dx0=e.clientX-r.left-72.5,dy0=e.clientY-r.top-72.5,L=Math.hypot(dx0,dy0),z=50;let dx=dx0,dy=dy0;if(L>z){dx=dx0/L*z;dy=dy0/L*z}jx=dx/z;jy=dy/z;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);joyMove(e)};joy.onpointermove=e=>{if(e.pointerId===jid)joyMove(e)};joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;stick.style.transform='translate(0,0)'}};
const keys={u:0,d:0,l:0,r:0,run:0};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.u=1;if(k==='s'||k==='arrowdown')keys.d=1;if(k==='a'||k==='arrowleft')keys.l=1;if(k==='d'||k==='arrowright')keys.r=1;if(k==='shift')keys.run=1;if(k==='e')toggleCar();if(k==='f')action();if(k==='p')paused=!paused});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.u=0;if(k==='s'||k==='arrowdown')keys.d=0;if(k==='a'||k==='arrowleft')keys.l=0;if(k==='d'||k==='arrowright')keys.r=0;if(k==='shift')keys.run=0});
function bind(id,fn,up){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();fn()};if(up)b.onpointerup=up}bind('car',toggleCar);bind('act',action);bind('horn',()=>say('📣 BEEP!'));bind('pause',()=>paused=!paused);bind('run',()=>keys.run=1,()=>keys.run=0);bind('job',startJob);bind('save',save);bind('load',load);
function say(t){const e=document.getElementById('msg');e.textContent=t;e.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>e.style.opacity=0,1400)}
function A(){return inCar?car:p}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(o){o.x=Math.max(-WORLD+20,Math.min(WORLD-20,o.x));o.y=Math.max(-WORLD+20,Math.min(WORLD-20,o.y))}
function nearestRoad(o){const gx=Math.round(o.x/GRID)*GRID,gy=Math.round(o.y/GRID)*GRID;return Math.abs(o.x-gx)<Math.abs(o.y-gy)?{type:'v',q:gx}:{type:'h',q:gy}}
function snapCarToRoad(){const r=nearestRoad(car);if(r.type==='v'){car.x=r.q+(car.a>0?18:-18)}else{car.y=r.q+(car.a>Math.PI/2?18:-18)}}
function toggleCar(){if(!started)return;if(inCar){inCar=false;p.x=car.x+42;p.y=car.y;say('Keluar mobil');return}const q=cars.find(v=>d(p,v)<55);if(q){car.x=q.x;car.y=q.y;car.a=q.a;inCar=true;snapCarToRoad();say('🚗 Masuk mobil')}else say('Dekati mobil')}
function spawnPolice(n){police=[];for(let i=0;i<n;i++){const a=rnd(0,6.28);police.push({x:A().x+Math.cos(a)*rnd(280,450),y:A().y+Math.sin(a)*rnd(280,450),a:0,s:rnd(70,110)})}}
function finishMission(){const reward=300+mission*120+level*50;money+=reward;xp+=25;if(xp>=100){xp-=100;level++;money+=500;say('⭐ LEVEL '+level+'! +$500')}wanted=Math.min(5,1+Math.floor(mission/3));if(wanted)spawnPolice(wanted+1);say('Misi selesai! +$'+reward);mission=(mission+1)%missions.length}
function startJob(){if(job){say('💼 Job masih berjalan');return}job={x:A().x+rnd(-600,600),y:A().y+rnd(-600,600)};jobTime=35;say('💼 Cari titik biru')}
function finishJob(){const reward=450+level*80;money+=reward;xp+=20;job=null;jobTime=0;say('💼 Job selesai! +$'+reward)}
function refuel(){if(d(A(),places[0])<100&&money>=100){money-=100;car.fuel=100;say('⛽ BBM penuh -$100')}else say('Dekati toko dan siapkan $100')}function action(){const a=A();if(job&&d(a,job)<90){finishJob();return}if(d(a,missions[mission])<90){finishMission();return}for(const q of places)if(d(a,q)<80){if(q.t==='shop'){money=Math.max(0,money-50);p.hp=Math.min(100,p.hp+35);say('🛒 Toko -$50')}else if(q.t==='garage'){if(money>=120){money-=120;p.hp=100;car.s=0;say('🔧 Bengkel -$120')}else say('Uang kurang')}else{wanted=0;police=[];say('🏠 Aman')}}}
function hitBuilding(o){for(const b of buildings)if(o.x>b.x-18&&o.x<b.x+b.w+18&&o.y>b.y-18&&o.y<b.y+b.h+18)return true;return false}function move(dt){let dx=jx+keys.r-keys.l,dy=jy+keys.d-keys.u,L=Math.hypot(dx,dy);if(L>1){dx/=L;dy/=L}if(!dx&&!dy)return;if(inCar){if(Math.abs(dx)>=Math.abs(dy)){car.a=dx>=0?0:Math.PI;car.y=Math.round(car.y/GRID)*GRID+(dx>=0?-18:18);car.x+=Math.sign(dx)*Math.min(260,car.s+80)*dt}else{car.a=dy>=0?Math.PI/2:-Math.PI/2;car.x=Math.round(car.x/GRID)*GRID+(dy>=0?18:-18);car.y+=Math.sign(dy)*Math.min(260,car.s+80)*dt}if(car.fuel<=0){car.s=0;say('⛽ BBM habis');return}const boost=(keys.run&&car.nitro>0)?180:0;if(boost)car.nitro=Math.max(0,car.nitro-32*dt);else car.nitro=Math.min(100,car.nitro+10*dt);car.s=Math.min(320,car.s+(260+boost)*dt);car.fuel=Math.max(0,car.fuel-car.s*0.012*dt);if(hitBuilding(car)){car.x-=Math.cos(car.a)*car.s*dt;car.y-=Math.sin(car.a)*car.s*dt;car.s=0;car.damage=Math.min(100,car.damage+12);p.hp=Math.max(0,p.hp-8);say('💥 Mobil rusak '+Math.floor(car.damage)+'%')}clamp(car);p.x=car.x;p.y=car.y}else{const v=keys.run&&p.st>0?205:125;p.a=Math.atan2(dy,dx);const ox=p.x,oy=p.y;p.x+=dx*v*dt;p.y+=dy*v*dt;if(hitBuilding(p)){p.x=ox;p.y=oy}clamp(p);if(keys.run)p.st=Math.max(0,p.st-30*dt);else p.st=Math.min(100,p.st+20*dt)}}
function ai(dt){for(const q of cars){q.x+=Math.cos(q.a)*q.s*dt;q.y+=Math.sin(q.a)*q.s*dt;const gx=Math.round(q.x/GRID)*GRID,gy=Math.round(q.y/GRID)*GRID;const ix=Math.abs(q.x-gx)<3,iy=Math.abs(q.y-gy)<3;if(ix||iy){if(Math.random()<0.018){const turns=[0,Math.PI/2,Math.PI,-Math.PI/2];q.a=turns[Math.floor(Math.random()*turns.length)];if(Math.abs(Math.cos(q.a))>.5)q.y=gy+(q.a>0?18:-18);else q.x=gx+(q.a>0?18:-18)}}if(q.x>WORLD)q.x=-WORLD;if(q.x<-WORLD)q.x=WORLD;if(q.y>WORLD)q.y=-WORLD;if(q.y<-WORLD)q.y=WORLD}for(const n of npcs){n.t-=dt;if(n.t<0){n.a+=rnd(-1,1);n.t=rnd(1,4)}n.x+=Math.cos(n.a)*n.s*dt;n.y+=Math.sin(n.a)*n.s*dt}for(const q of police){const a=A(),ang=Math.atan2(a.y-q.y,a.x-q.x);q.a=ang;q.x+=Math.cos(ang)*q.s*dt;q.y+=Math.sin(ang)*q.s*dt;if(d(q,a)<38)p.hp-=15*dt}}
function drawCar(q,cx,cy,pol=false){const X=q.x-cx+W/2,Y=q.y-cy+H/2;ctx.save();ctx.translate(X,Y);ctx.rotate(q.a);ctx.fillStyle='#0008';ctx.fillRect(-34,-17,68,34);ctx.fillStyle=pol?'#e8e8e8':q.col;ctx.beginPath();ctx.roundRect(-32,-15,64,30,7);ctx.fill();ctx.fillStyle='#203846';ctx.beginPath();ctx.moveTo(-10,-12);ctx.lineTo(13,-12);ctx.lineTo(22,-7);ctx.lineTo(22,7);ctx.lineTo(13,12);ctx.lineTo(-10,12);ctx.closePath();ctx.fill();ctx.fillStyle='#f7f1c8';ctx.fillRect(25,-9,5,6);ctx.fillRect(25,3,5,6);ctx.fillStyle='#d33';ctx.fillRect(-31,-9,5,6);ctx.fillRect(-31,3,5,6);ctx.fillStyle='#1118';ctx.fillRect(13,-10,7,20);if(pol){ctx.fillStyle='#e33';ctx.fillRect(-6,-18,9,5);ctx.fillStyle='#38aaff';ctx.fillRect(4,-18,9,5)}ctx.restore()}
function draw(){const a=A(),cx=a.x,cy=a.y;ctx.fillStyle='#4f7b49';ctx.fillRect(0,0,W,H);const night=(Math.sin(clock*0.08)<-0.15);ctx.fillStyle=night?'#0b122855':'#ffffff00';ctx.fillRect(0,0,W,H);for(const r of roads){ctx.fillStyle='#363a3e';ctx.fillRect(r.x-cx+W/2,r.y-cy+H/2,r.w,r.h)}ctx.strokeStyle='#d6c34c';ctx.lineWidth=2;ctx.setLineDash([14,18]);for(let q=-WORLD;q<=WORLD;q+=GRID){ctx.beginPath();ctx.moveTo(q-cx+W/2,0);ctx.lineTo(q-cx+W/2,H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,q-cy+H/2);ctx.lineTo(W,q-cy+H/2);ctx.stroke()}ctx.setLineDash([]);
for(const b of buildings){const X=b.x-cx+W/2,Y=b.y-cy+H/2;if(X<-120||X>W+120||Y<-120||Y>H+120)continue;ctx.fillStyle='#1119';ctx.fillRect(X+5,Y+6,b.w,b.h);ctx.fillStyle=b.col;ctx.fillRect(X,Y,b.w,b.h);ctx.fillStyle='#fff3';for(let wx=X+8;wx<X+b.w-5;wx+=18)for(let wy=Y+8;wy<Y+b.h-5;wy+=18)ctx.fillRect(wx,wy,7,8)}
for(const t of trees){const X=t.x-cx+W/2,Y=t.y-cy+H/2;if(X>-20&&X<W+20&&Y>-20&&Y<H+20){ctx.fillStyle='#286238';ctx.beginPath();ctx.arc(X,Y,13,0,7);ctx.fill()}}
for(const l of lights){const X=l.x-cx+W/2,Y=l.y-cy+H/2;if(X>-30&&X<W+30&&Y>-30&&Y<H+30){ctx.fillStyle=((Math.floor(clock+l.phase)%8)<4)?'#2fc96b':'#e14b4b';ctx.fillRect(X-5,Y-28,10,10);ctx.fillRect(X+18,Y-5,10,10)}}for(const q of places){const X=q.x-cx+W/2,Y=q.y-cy+H/2;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(X,Y,20,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='15px Arial';ctx.textAlign='center';ctx.fillText(q.t==='shop'?'🛒':q.t==='garage'?'🔧':'🏠',X,Y+5)}
const target=missions[mission];ctx.strokeStyle='#ffd329';ctx.lineWidth=3;ctx.beginPath();ctx.arc(target.x-cx+W/2,target.y-cy+H/2,24+Math.sin(clock*5)*4,0,7);ctx.stroke();if(job){ctx.strokeStyle='#4fc4ff';ctx.beginPath();ctx.arc(job.x-cx+W/2,job.y-cy+H/2,18,0,7);ctx.stroke()}
for(const q of cars)drawCar(q,cx,cy);for(const n of npcs){const X=n.x-cx+W/2,Y=n.y-cy+H/2;if(X>-10&&X<W+10&&Y>-10&&Y<H+10){ctx.fillStyle='#d49a70';ctx.beginPath();ctx.arc(X,Y,6,0,7);ctx.fill();ctx.fillRect(X-5,Y+5,10,12)}}for(const q of police)drawCar(q,cx,cy,true);if(inCar){drawCar(car,cx,cy);ctx.save();ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(car.s>5?'▲ '+Math.floor(car.s)+' km/h':'■ 0',W/2,H-105);ctx.restore();if(keys.run&&car.nitro>0){ctx.save();const X=car.x-cx+W/2,Y=car.y-cy+H/2;ctx.translate(X,Y);ctx.rotate(car.a);ctx.fillStyle='#63d9ff';ctx.beginPath();ctx.moveTo(-30,-7);ctx.lineTo(-52,0);ctx.lineTo(-30,7);ctx.fill();ctx.restore()}}elseelse{const X=p.x-cx+W/2,Y=p.y-cy+H/2;ctx.fillStyle='#2879dc';ctx.beginPath();ctx.arc(X,Y,10,0,7);ctx.fill();ctx.fillStyle='#d49a70';ctx.beginPath();ctx.arc(X,Y-11,6,0,7);ctx.fill()}
if(rain>0){ctx.strokeStyle='#9bdcff88';ctx.lineWidth=1;for(let i=0;i<90;i++){const rx=(i*83+clock*260)%W,ry=(i*47+clock*420)%H;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-4,ry+15);ctx.stroke()}}if(paused){ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText('PAUSE',W/2,H/2)}}
function mini(){const S=135,sc=S/(WORLD*2);mm.fillStyle='#18251b';mm.fillRect(0,0,S,S);for(const r of roads){mm.fillStyle='#3b3f43';mm.fillRect(S/2+r.x*sc,S/2+r.y*sc,r.w*sc,r.h*sc)}function dot(q,col,r){mm.fillStyle=col;mm.beginPath();mm.arc(S/2+q.x*sc,S/2+q.y*sc,r,0,7);mm.fill()}dot(missions[mission],'#ffd329',4);for(const q of places)dot(q,q.col,3);for(const q of police)dot(q,'#e33',2);if(job)dot(job,'#4fc4ff',4);dot(A(),'#fff',4)}
function ui(){document.getElementById('speed').textContent=inCar?Math.floor(car.s):0;document.getElementById('money').textContent=Math.floor(money);document.getElementById('hp').textContent=Math.max(0,Math.floor(p.hp));document.getElementById('stam').textContent=Math.floor(p.st);document.getElementById('fuel').textContent=Math.floor(car.fuel);document.getElementById('nitro').textContent=Math.floor(car.nitro);document.getElementById('wanted').textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted);document.getElementById('mission').textContent='MISI '+(mission+1)+': '+missions[mission].t+(d(A(),missions[mission])<90?' • TEKAN AKSI':'')+' • LV '+level+' XP '+xp+'/100'+(job?' • 💼 '+Math.ceil(jobTime)+'s':'')}
function save(){localStorage.setItem('openCityV13',JSON.stringify({money,wanted,mission,xp,level,p,car}));say('💾 Tersimpan')}function load(){try{const s=JSON.parse(localStorage.getItem('openCityV13'));if(!s)return say('Belum ada save');money=s.money;wanted=s.wanted;mission=s.mission;xp=s.xp;level=s.level;Object.assign(p,s.p);Object.assign(car,s.car);police=[];if(wanted)spawnPolice(wanted+1);say('📂 Save dimuat')}catch(e){say('Save rusak')}}
function weatherTick(dt){if(Math.random()<0.0008)weather=weather==='clear'?'rain':'clear';rain=weather==='rain'?Math.min(1,rain+dt):Math.max(0,rain-dt)}function loop(t){requestAnimationFrame(loop);if(!started)return;const dt=Math.min(.04,(t-last)/1000);last=t;if(!paused){clock+=dt;weatherTick(dt);move(dt);ai(dt);if(job){jobTime-=dt;if(jobTime<=0){job=null;say('💼 Job gagal')}}if(p.hp<=0){p.hp=100;money=Math.max(0,money-200);wanted=0;police=[];say('Kamu tumbang -$200')}}draw();mini();ui()}
document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none';say('V13 siap! Mobil punya depan-belakang jelas dan lalu lintas bisa belok di persimpangan')};requestAnimationFrame(loop);
})();</script></body></html>
