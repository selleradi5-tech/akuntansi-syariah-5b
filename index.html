<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Open City V16</title><style>html,body{margin:0;overflow:hidden;background:#18251b;font-family:Arial;color:#fff;touch-action:none}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:8px;left:8px;right:8px;z-index:3;font-size:13px;text-shadow:0 2px 3px #000}#start{position:fixed;inset:0;background:#101820;z-index:9;display:flex;align-items:center;justify-content:center}.panel{width:85%;max-width:400px;text-align:center;background:#18232c;padding:25px;border-radius:20px}.play{width:100%;height:58px;border:0;border-radius:14px;background:#28a763;color:#fff;font-size:18px;font-weight:bold}.btn{position:fixed;z-index:5;width:72px;height:52px;border:1px solid #fff5;border-radius:14px;background:#071018dd;color:#fff;font-weight:bold}.joy{position:fixed;z-index:5;left:15px;bottom:18px;width:140px;height:140px;border:2px solid #fff3;border-radius:50%;background:#fff1}.stick{position:absolute;left:39px;top:39px;width:58px;height:58px;border-radius:50%;background:#fff5}.a{right:15px;bottom:78px}.b{right:95px;bottom:18px}</style></head><body><canvas id="c"></canvas><div id="hud">🌆 OPEN CITY V16<br>💵 $<span id="money">1000</span> ❤️ <span id="hp">100</span> 🚨 <span id="wanted">☆☆☆☆☆</span><br><span id="mission">Misi: pergi ke titik kuning</span></div><div class="joy" id="joy"><div class="stick" id="stick"></div></div><button class="btn a" id="act">AKSI</button><button class="btn b" id="car">MOBIL</button><div id="start"><div class="panel"><h1>🌆 OPEN CITY V16</h1><p>Upgrade: lalu lintas, minimap, bensin, siang-malam, misi, polisi, dan kontrol sentuh.</p><button class="play" id="play">▶ MULAI GAME</button></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W=innerWidth,H=innerHeight;function size(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}size();addEventListener('resize',size);const p={x:0,y:0},car={x:80,y:0,a:0},target={x:600,y:600};let started=false,inCar=false,money=1000,hp=100,wanted=0,joyX=0,joyY=0,last=0,fuel=100,clock=8;const traffic=[];for(let i=0;i<12;i++)traffic.push({x:(i*233)%1800-900,y:(i*317)%1800-900,a:i%2?Math.PI/2:0,s:70+(i%4)*15});const npcs=[];for(let i=0;i<35;i++)npcs.push({x:(i*157)%1400-700,y:(i*263)%1400-700});const police=[];const joy=document.getElementById('joy'),stick=document.getElementById('stick');let id=null;function j(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-70,dy=e.clientY-r.top-70,l=Math.hypot(dx,dy),m=52,q=l>m?m/l:1;joyX=dx*q/m;joyY=dy*q/m;stick.style.transform='translate('+dx*q+'px,'+dy*q+'px)'}joy.onpointerdown=e=>{id=e.pointerId;joy.setPointerCapture(id);j(e)};joy.onpointermove=e=>{if(e.pointerId===id)j(e)};joy.onpointerup=joy.onpointercancel=()=>{id=null;joyX=joyY=0;stick.style.transform='translate(0,0)'};function toggle(){if(!started)return;if(inCar){inCar=false;p.x=car.x+35;p.y=car.y}else{if(Math.hypot(p.x-car.x,p.y-car.y)<70){inCar=true;p.x=car.x;p.y=car.y}}}function action(){if(!started)return;if(Math.hypot((inCar?car.x:p.x)-target.x,(inCar?car.y:p.y)-target.y)<70){money+=300;target.x=(target.x+600)%1200-600;target.y=(target.y+600)%1200-600;wanted=Math.min(5,wanted+1);document.getElementById('mission').textContent='Misi selesai! +$300. Tujuan berikutnya.';for(let i=0;i<wanted;i++)police.push({x:(inCar?car.x:p.x)+300,y:(inCar?car.y:p.y)+300})}}document.getElementById('act').onclick=action;document.getElementById('car').onclick=toggle;document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none';last=performance.now()};function draw(t){clock=(clock+.006)%24;const night=clock<6||clock>18;x.fillStyle=night?'#18243a':'#4d7b48';x.fillRect(0,0,W,H);const o=inCar?car:p,cx=o.x,cy=o.y;x.fillStyle='#3a3d40';for(let q=-1800;q<=1800;q+=300){x.fillRect(q-cx+W/2,0,70,H);x.fillRect(0,q-cy+H/2,W,70)}x.strokeStyle='#d7c84c';x.setLineDash([12,16]);for(let q=-1800;q<=1800;q+=300){x.beginPath();x.moveTo(q-cx+W/2,0);x.lineTo(q-cx+W/2,H);x.stroke();x.beginPath();x.moveTo(0,q-cy+H/2);x.lineTo(W,q-cy+H/2);x.stroke()}x.setLineDash([]);for(let q=-1500;q<=1500;q+=300)for(let r=-1500;r<=1500;r+=300){x.fillStyle='#626b70';x.fillRect(q-cx+W/2+80,r-cy+H/2+80,130,120)}for(const v of traffic){v.x+=Math.cos(v.a)*v.s*(1/60);v.y+=Math.sin(v.a)*v.s*(1/60);if(v.x>1000)v.x=-1000;if(v.x<-1000)v.x=1000;if(v.y>1000)v.y=-1000;if(v.y<-1000)v.y=1000;x.save();x.translate(v.x-cx+W/2,v.y-cy+H/2);x.rotate(v.a);x.fillStyle='#e6a72e';x.fillRect(-20,-10,40,20);x.fillStyle='#17242b';x.fillRect(-6,-8,14,16);x.restore()}for(const n of npcs){x.fillStyle='#e1a17d';x.beginPath();x.arc(n.x-cx+W/2,n.y-cy+H/2,6,0,Math.PI*2);x.fill()}x.fillStyle='#ffd21c';x.beginPath();x.arc(target.x-cx+W/2,target.y-cy+H/2,20,0,Math.PI*2);x.fill();if(inCar){x.save();x.translate(W/2,H/2);x.rotate(car.a);x.fillStyle='#d74343';x.fillRect(-32,-15,64,30);x.fillStyle='#203846';x.fillRect(-8,-11,28,22);x.fillStyle='#fff3b0';x.fillRect(25,-8,5,6);x.fillRect(25,2,5,6);x.restore()}else{x.fillStyle='#267be0';x.beginPath();x.arc(W/2,H/2,11,0,Math.PI*2);x.fill()}for(const q of police){q.x+=(o.x-q.x)*.003;q.y+=(o.y-q.y)*.003;x.fillStyle='#fff';x.fillRect(q.x-cx+W/2-12,q.y-cy+H/2-7,24,14)}document.getElementById('money').textContent=money;document.getElementById('hp').textContent=hp;document.getElementById('fuel').textContent=Math.max(0,Math.floor(fuel));document.getElementById('clock').textContent=String(Math.floor(clock)).padStart(2,'0')+':'+String(Math.floor((clock%1)*60)).padStart(2,'0');document.getElementById('wanted').textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted)}function loop(t){if(started){const dt=Math.min(.04,(t-last)/1000);last=t;let dx=joyX,dy=joyY;if(inCar){if(Math.abs(dx)+Math.abs(dy)>0&&fuel>0){fuel-=Math.hypot(dx,dy)*0.9;if(Math.abs(dx)>Math.abs(dy)){car.a=dx>0?0:Math.PI;car.x+=dx*280*dt}else{car.a=dy>0?Math.PI/2:-Math.PI/2;car.y+=dy*280*dt}p.x=car.x;p.y=car.y}}else{p.x+=dx*170*dt;p.y+=dy*170*dt}draw(t)}requestAnimationFrame(loop)}requestAnimationFrame(loop)})()</script><div id="extra" style="position:fixed;right:8px;top:62px;z-index:4;font-size:12px;text-shadow:0 2px 3px #000;text-align:right">⛽ <span id="fuel">100</span>%<br>🕐 <span id="clock">08:00</span></div></body></html>
