name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
          
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          set -e
          test -f AkuntansiSyariah5B_CloudBuild.zip
          unzip -q -o AkuntansiSyariah5B_CloudBuild.zip
          test -f settings.gradle.kts
          test -d app

      - name: Configure Android project
        run: |
          set -e
          find app/src/main/res -type f -name '*.xml' -print0 | xargs -0 sed -i 's/Theme\.AppCompat\.DayNight\.NoActionBar/android:style\/Theme.Material.Light.NoActionBar/g' || true
          cat > settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AkuntansiSyariah5B"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.13.0" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.akuntansisyariah.aks5b"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.akuntansisyariah.aks5b"
                  minSdk = 23
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
          }
          EOF
          find app/src -type f \( -name '*.kt' -o -name '*.kts' \) -delete || true
          mkdir -p app/src/main/java/com/akuntansisyariah/aks5b
          cat > app/src/main/java/com/akuntansisyariah/aks5b/MainActivity.java <<'EOF'
          package com.akuntansisyariah.aks5b;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView webView;
              private static final String URL = "https://akuntansi-syariah-5b.hatchable.site/";
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl(URL);
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1B5E20</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="Akuntansi Syariah 5B"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build release AAB
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          CLEAN_BASE64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          REMAINDER=$(( ${#CLEAN_BASE64} % 4 ))
          if [ "$REMAINDER" -eq 2 ]; then CLEAN_BASE64="${CLEAN_BASE64}=="; fi
          if [ "$REMAINDER" -eq 3 ]; then CLEAN_BASE64="${CLEAN_BASE64}="; fi
          printf '%s' "$CLEAN_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          test -s "$RUNNER_TEMP/release-keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/release-keystore.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Sign release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          PRIVATE_ALIAS="$(keytool -list -v -keystore "$RUNNER_TEMP/release-keystore.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk '/Alias name:/{a=$0} /Entry type: PrivateKeyEntry/{print a; exit}' | sed 's/^Alias name: //')"
          test -n "$PRIVATE_ALIAS"
          echo "Private-key entry detected."
          if ! jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/release-keystore.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$PRIVATE_ALIAS"; then
            echo "KEY_PASSWORD did not unlock the private key; retrying with KEYSTORE_PASSWORD as key password."
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/release-keystore.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" "$AAB" "$PRIVATE_ALIAS"
          fi
          mv "$AAB" "app/build/outputs/bundle/release/AkuntansiSyariah5B-release.aab"
          jarsigner -verify -verbose -certs "app/build/outputs/bundle/release/AkuntansiSyariah5B-release.aab" >/dev/null

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: AkuntansiSyariah5B-release-AAB
          path: app/build/outputs/bundle/release/AkuntansiSyariah5B-release.aab
          if-no-files-found: error
