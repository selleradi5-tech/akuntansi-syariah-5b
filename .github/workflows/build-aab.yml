name: Membangun Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Akuntansi Syariah 5B
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instal JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pengaturan Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instal paket Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================
      # CARI DAN SIAPKAN PROJECT ANDROID
      # ==========================================
      - name: Cari dan siapkan project Android
        shell: bash
        run: |

          echo "========================================"
          echo "ISI REPOSITORY"
          echo "========================================"

          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort

          echo ""
          echo "========================================"
          echo "MENCARI PROJECT ANDROID"
          echo "========================================"

          # Cari settings.gradle / settings.gradle.kts
          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            ! -path './.git/*' \
            | head -n 1)

          # Jika belum ditemukan, cari ZIP project
          if [ -z "$SETTINGS" ]; then

            echo "Project Android belum ditemukan."
            echo "Mencari file ZIP..."

            ZIPFILE=$(find . \
              -maxdepth 3 \
              -type f \
              \( -name "*.zip" -o -name "*.ZIP" \) \
              ! -path './.git/*' \
              | head -n 1)

            if [ -n "$ZIPFILE" ]; then

              echo "ZIP ditemukan:"
              echo "$ZIPFILE"

              mkdir -p extracted_android

              unzip -q "$ZIPFILE" -d extracted_android

              echo ""
              echo "ZIP berhasil diekstrak."

              echo "Mencari project Android di dalam ZIP..."

              SETTINGS=$(find extracted_android \
                -type f \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                | head -n 1)

            fi
          fi

          # Pastikan project ditemukan
          if [ -z "$SETTINGS" ]; then

            echo ""
            echo "========================================"
            echo "ERROR"
            echo "========================================"
            echo "Project Android tidak ditemukan."
            echo ""
            echo "File yang tersedia:"
            find . -maxdepth 5 -type f \
              ! -path './.git/*' \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "========================================"
          echo "PROJECT ANDROID DITEMUKAN"
          echo "========================================"
          echo "Settings : $SETTINGS"
          echo "Folder   : $PROJECT_DIR"
          echo "========================================"

          # Pastikan build.gradle dan app ada
          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "PERINGATAN: build.gradle tidak ditemukan di root project."
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "PERINGATAN: folder app tidak ditemukan."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # INSTALL GRADLE
      # ==========================================
      - name: Instal Gradle
        run: |

          wget -q \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip

          unzip -q gradle-8.13-bin.zip

          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

          echo "Gradle:"
          gradle --version

      # ==========================================
      # BUILD AAB
      # ==========================================
      - name: Bangun AAB
        shell: bash
        run: |

          echo "========================================"
          echo "MEMBANGUN ANDROID APP BUNDLE"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo "Folder project:"
          pwd

          echo ""
          echo "Isi project:"
          ls -la

          echo ""
          echo "Menjalankan Gradle..."

          gradle bundleRelease \
            --no-daemon \
            --stacktrace

      # ==========================================
      # CEK HASIL
      # ==========================================
      - name: Periksa hasil AAB
        shell: bash
        run: |

          echo "========================================"
          echo "MENCARI FILE AAB"
          echo "========================================"

          find . \
            -type f \
            -name "*.aab" \
            ! -path './.git/*' \
            -print

          AAB=$(find . \
            -type f \
            -name "*.aab" \
            ! -path './.git/*' \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo ""
            echo "ERROR: AAB tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "AAB BERHASIL DIBUAT:"
          echo "$AAB"

      # ==========================================
      # UPLOAD AAB
      # ==========================================
      - name: Unggah AAB
        uses: actions/upload-artifact@v4
        with:
          name: AkuntansiSyariah5B-AAB
          path: |
            **/*.aab
          if-no-files-found: error
