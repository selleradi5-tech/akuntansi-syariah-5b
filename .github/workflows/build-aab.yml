name: Membangun Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. Ambil isi repository
      # =========================
      - name: Checkout
        uses: actions/checkout@v7

      # =========================
      # 2. Install Java 17
      # =========================
      - name: Instal JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # =========================
      # 3. Setup Android SDK
      # =========================
      - name: Pengaturan Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # =========================
      # 4. Install SDK yang dibutuhkan
      # =========================
      - name: Instal paket Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # =========================
      # 5. Cari Gradle Wrapper
      # =========================
      - name: Cari project Android
        shell: bash
        run: |
          echo "======================================"
          echo "Mencari file Gradle Wrapper..."
          echo "======================================"

          find . -type f -name "gradlew" -print

          GRADLEW=$(find . -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "gradlew belum ditemukan."
            echo "Mencari file ZIP project Android..."

            ZIP=$(find . -type f \( -name "*.zip" -o -name "*.ZIP" \) | head -n 1)

            if [ -n "$ZIP" ]; then
              echo "ZIP ditemukan: $ZIP"
              mkdir -p android_project
              unzip -q "$ZIP" -d android_project

              echo ""
              echo "Mencari gradlew setelah ekstraksi:"
              find android_project -type f -name "gradlew" -print

              GRADLEW=$(find android_project -type f -name "gradlew" | head -n 1)
            fi
          fi

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: gradlew tidak ditemukan."
            echo "======================================"
            echo ""
            echo "Isi repository:"
            find . -maxdepth 4 -type f | sort | head -n 300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "======================================"
          echo "Gradle ditemukan!"
          echo "GRADLEW: $GRADLEW"
          echo "PROJECT: $PROJECT_DIR"
          echo "======================================"

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================
      # 6. Jadikan Gradle executable
      # =========================
      - name: Jadikan Gradle dapat dieksekusi
        run: |
          echo "Menggunakan:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

          "$GRADLEW" --version

      # =========================
      # 7. Build AAB
      # =========================
      - name: Bangun AAB
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Membangun Android App Bundle..."
          echo "======================================"

          ./gradlew bundleRelease --no-daemon --stacktrace

      # =========================
      # 8. Cari hasil AAB
      # =========================
      - name: Cari hasil AAB
        run: |
          echo "======================================"
          echo "Mencari file AAB..."
          echo "======================================"

          find . -type f -name "*.aab" -print

      # =========================
      # 9. Upload AAB
      # =========================
      - name: Unggah AAB
        uses: actions/upload-artifact@v4
        with:
          name: AkuntansiSyariah5B-AAB
          path: |
            **/*.aab
          if-no-files-found: error
