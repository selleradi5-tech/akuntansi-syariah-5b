name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Proyek Ekstrak
        shell: bash
        run: |
          set -e

          echo "=== Isi repository ==="
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP project tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          echo "=== Struktur project ==="
          find project -maxdepth 3 -type f | head -100

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pengaturan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pengaturan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bangun AAB
        working-directory: project
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Cari AAB
        shell: bash
        run: |
          echo "=== File AAB ==="
          find project -type f -name "*.aab" -print

      - name: Unggah AAB
        uses: actions/upload-artifact@v4
        with:
          name: AkuntansiSyariah5B-AAB
          path: project/**/build/outputs/bundle/**/*.aab
          if-no-files-found: error
