name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak project
        run: |
          unzip -o AkuntansiSyariah5B_CloudBuild.zip -d project
          cp -r project/. project/
          ls -la project

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build AAB
        working-directory: project
        run: gradle --no-daemon bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AkuntansiSyariah5B-AAB
          path: project/app/build/outputs/bundle/release/app-release.aab
