name: Membangun Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Akuntansi Syariah 5B
    runs-on: ubuntu-latest

    steps:

      # 1. Ambil repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Instal JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Pengaturan Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 4. Install Android SDK yang dibutuhkan
      - name: Instal paket Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Pastikan project Android ditemukan
      - name: Periksa project Android
        run: |
          echo "Isi folder android_project:"
          find android_project -maxdepth 3 -type f | sort

          echo ""
          echo "Memeriksa file Gradle..."

          test -f android_project/settings.gradle.kts
          test -f android_project/build.gradle.kts
          test -f android_project/app/build.gradle.kts

          echo "Project Android ditemukan."

      # 6. Download Gradle
      - name: Instal Gradle 8.13
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

          gradle --version

      # 7. Build Android App Bundle
      - name: Bangun AAB
        working-directory: android_project
        run: |
          gradle bundleRelease --no-daemon --stacktrace

      # 8. Periksa hasil AAB
      - name: Periksa hasil AAB
        run: |
          echo "Mencari file AAB..."

          find android_project -type f -name "*.aab" -print

          if ! find android_project -type f -name "*.aab" | grep -q ".aab"; then
            echo "ERROR: File AAB tidak berhasil dibuat."
            exit 1
          fi

          echo "AAB berhasil dibuat."

      # 9. Upload AAB
      - name: Unggah AAB
        uses: actions/upload-artifact@v4
        with:
          name: AkuntansiSyariah5B-AAB
          path: android_project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
